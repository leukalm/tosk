version: 2

project_name: tosk

before:
  hooks:
    - go mod verify

builds:
  - env: [CGO_ENABLED=0]
    flags: [-trimpath]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/leukalm/tosk/internal/cli.Version={{ .Version }}
    # Reproducible builds: file times come from the commit, not the clock.
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

# Release notes come from CHANGELOG.md, passed with --release-notes (see
# .github/workflows/release.yml), which replaces the generated changelog.
# Do not set changelog.disable: it drops those notes too.

release:
  # v0.x is a beta: say so on the release page.
  header: |
    Beta release. The configuration format may still change before 1.0.

# Homebrew and Scoop packages are not published yet. They need the
# repositories leukalm/homebrew-tap and leukalm/scoop-bucket and a token
# with write access to them; see GoReleaser's `brews` and `scoops`.
