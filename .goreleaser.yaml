version: 2

project_name: tosk

before:
  hooks:
    - go mod verify

builds:
  - env: [CGO_ENABLED=0]
    flags: [-trimpath]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/leukalm/tosk/internal/cli.Version={{ .Version }}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]

# `brew install tosk` and `scoop install tosk` need these two repositories
# to exist: leukalm/homebrew-tap and leukalm/scoop-bucket.
brews:
  - repository:
      owner: leukalm
      name: homebrew-tap
      token: "{{ .Env.PACKAGES_TOKEN }}"
    homepage: https://github.com/leukalm/tosk
    description: Environment preparation for git worktrees
    license: MIT

scoops:
  - repository:
      owner: leukalm
      name: scoop-bucket
      token: "{{ .Env.PACKAGES_TOKEN }}"
    homepage: https://github.com/leukalm/tosk
    description: Environment preparation for git worktrees
    license: MIT
